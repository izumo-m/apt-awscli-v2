name = "apt-awscli-v2-proxy"
main = "index.js"
compatibility_date = "2026-04-19"

# This file exists only for `wrangler dev` and `wrangler tail` against the
# locally-checked-out Worker source. Production deployment is managed by
# Pulumi (see ../pulumi/src/cloudflare.ts) — do NOT run `wrangler deploy`
# from this directory.
#
# For `wrangler dev`, set ORIGIN_BASE_URL in cloudflare/.dev.vars (gitignored).


# Optional request analytics (Workers Analytics Engine). In production the
# binding is added by Pulumi when aptAwscliV2:cloudflareAnalyticsEnabled=true.
# Uncomment to exercise the recording code path under `wrangler dev`:
# [[analytics_engine_datasets]]
# binding = "ANALYTICS"
# dataset = "apt_awscli_v2_dev_requests"
